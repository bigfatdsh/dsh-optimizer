# dsh-optimizer —— 优化插件集 · DSH bundle 补丁。
#
# 只插入一行：把这个插件挂到 Host 根部。
#
# 为什么在根部：
#   * 精简化段落要在所有 preset 上一致生效，且恒定排在提示词最后（order 10200），
#     开关不变时逐字节稳定，不产生额外缓存失效；纪律段落排在它前面（order 10100）。
#   * 六项运行时优化挂的是宿主公开契约的钩子（`system-prompt/assemble`、
#     `tools/post-execute`、`session/event`、`agent/pre-step`、`agent/request`）。
#     这些钩子的作用域规则是"根上挂一次覆盖所有 agent"，也就不会随会话数增长。
#   * 花费预警的监听（`session/event` 折钱、`agent/pre-step` 兜底）同理：花费只按
#     会话记一份，装一次就够；多挂几个反而会重复拦。
#   * **没有任何一处包住模型调用**（不碰 `llm/stream`、不改模型目录、不碰选择器）。
#
# 默认值的取舍只有一条标准：失败方向必须是"跟原来一样"。
#   * autoDefault: true        —— 旧开关，保留历史默认。
#   * conciseDefault: false    —— 精简化输出默认关闭。
#   * costGuardDefault: false  —— 花费预警默认**关闭**（要花钱的事，默认不设限）。
#   * costLimitDefault: 0      —— 预值（元）默认 0 = 不限。
#   * parallelDefault: true    —— 只加文字、不改既有行为 → 默认开。
#   * retryDefault: true       —— 加一个 575 字符的工具 + 失败结果后一行提示 → 默认开。
#   * resultCapDefault: true   —— 改结果但全文落盘可原样取回 → 默认开。
#   * cacheSafeDefault: true   —— 让内置裁剪器无事可做，已发前缀不被改写 → 默认开。
#   * repeatGuardDefault: true —— 只在连续空转时插话 → 默认开。
#   * lazyToolsDefault: false  —— 工具表变化会重建一次前缀缓存 → 默认关。
#   * autoCompactDefault: false —— 压缩要花一次摘要调用并改写历史 → 默认关。
#   * modelTierDefault: false  —— 换模型要花钱、也要用户点头 → 默认关。
#
# 开关状态记在 <DSH_HOME>/optimizer.json 里（persist: true 时），重启后保持。
# log: false —— 排查"到底生效没生效"时改成 true。
#
# 下面是几个"默认关但值得知道"的数字型配置（改这里，不在面板里）：
#   resultCapChars: 8192       结果上限（字符）；cacheSafe 打开时取它与内置裁剪器阈值的较小值。
#   autoCompactTokens: 300000  提前自动压缩的触发线；宿主默认线是 678,464。
#   repeatStopAfter: 4         复读连击到这个数就停这一步；0 = 只提醒不停。
#   lazyCore: ''               核心工具名单（逗号分隔）；留空用内置默认。
#   tierModelQuiet/Light/Standard/Heavy: ''  'provider/model'；留空 = 不换模型。
#   tierEffortQuiet/Light: 'off'/'low'      推理档位；留空 = 不动。

- insert:
    - id: concise
      name: 'dsh-optimizer'
      config:
        autoDefault: true
        conciseDefault: false
        costGuardDefault: false
        costLimitDefault: 0
        parallelDefault: true
        retryDefault: true
        resultCapDefault: true
        cacheSafeDefault: true
        repeatGuardDefault: true
        lazyToolsDefault: false
        autoCompactDefault: false
        modelTierDefault: false
        resultCapChars: 8192
        autoCompactTokens: 300000
        repeatStopAfter: 4
        lazyCore: ''
        tierModelQuiet: ''
        tierModelLight: ''
        tierModelStandard: ''
        tierModelHeavy: ''
        tierEffortQuiet: 'off'
        tierEffortLight: 'low'
        tierEffortStandard: ''
        tierEffortHeavy: ''
        persist: true
        log: false
